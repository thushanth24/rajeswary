<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://kkefwggimxljvelqtcjs.supabase.co" />

    <!-- Web App Manifest & Theme -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#8B1A1A" />

    <!-- Primary Meta Tags (per-route values are injected by RouteSeo / prerender) -->
    <title>Raajeshwariy Groups | Wedding Halls & Mandapams in Jaffna</title>
    <meta name="description" content="Premium wedding halls and mandapams across Jaffna — Kondavil, Tellipalai, Kokuvil, Urumpirai and Chunnakam. Check availability and book your wedding, reception or ceremony online." />

    <meta name="robots" content="index, follow" />
    <meta name="geo.region" content="LK-41" />
    <meta name="geo.placename" content="Jaffna" />
    <meta name="geo.position" content="9.6615;80.0255" />
    <meta name="ICBM" content="9.6615, 80.0255" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://raajeshwariygroups.com/" />
    <meta property="og:title" content="Raajeshwariy Groups | Wedding Halls & Mandapams in Jaffna" />
    <meta property="og:description" content="Premium wedding halls and event venues across Jaffna. Venues in Kondavil, Tellipalai, Kokuvil, Urumpirai and near Chunnakam." />

    <meta property="og:locale:alternate" content="ta_LK" />

    <meta name="twitter:image" content="https://raajeshwariygroups.com/og-cover.jpg" />

    <!-- Structured Data - Organization (site-wide). Per-venue LocalBusiness
         schema is emitted on each hall's own page. -->
    <script type="application/ld+json">

      "@context": "https://schema.org",

      "url": "https://raajeshwariygroups.com",

      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Jaffna",
        "addressRegion": "Northern Province",
        "addressCountry": "LK"
      },
      "areaServed": {
        "@type": "Place",
        "name": "Jaffna District"
      },
      "sameAs": []
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
